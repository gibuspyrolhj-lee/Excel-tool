<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>엑셀 파일 도구</title><style>body{margin:0;background:#f5f8f7;color:#192c29;font-family:Arial,"Malgun Gothic",sans-serif}header{background:white;border-bottom:1px solid #e1ebe8;padding:24px;font-size:18px;font-weight:bold}main{max-width:950px;margin:auto;padding:70px 24px}h1{font-size:40px;letter-spacing:-2px}p{color:#6c807a;line-height:1.7}.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-top:40px}.tool{display:block;background:white;color:inherit;text-decoration:none;border:1px solid #dce8e4;border-radius:16px;padding:30px}.tool:hover{border-color:#197767}.icon{color:#197767;font-size:28px}.action{color:#176e5e;font-weight:bold}</style></head><body><header>▦ 엑셀 파일 도구</header><main><p>CSV &amp; EXCEL TOOLS</p><h1>파일 작업을 더 간편하게.</h1><p>필요한 작업을 선택해 주세요. 파일 병합부터 출원연도별 분리까지 한곳에서 시작할 수 있습니다.</p><div class="tools"><a class="tool" href="merge.html"><span class="icon">⊕</span><h2>파일 합치기</h2><p>여러 CSV와 XLSX 파일을 하나의 파일로 병합합니다.</p><span class="action">파일 합치기 열기</span></a><a class="tool" href="split.html"><span class="icon">▤</span><h2>출원연도별 파일 분리</h2><p>출원일자를 기준으로 데이터를 연도별로 나눕니다.</p><span class="action">파일 분리 열기</span></a></div><p>파일은 브라우저에서 처리됩니다. 파일 처리 라이브러리를 불러오려면 인터넷 연결이 필요합니다.</p></main></body></html>
