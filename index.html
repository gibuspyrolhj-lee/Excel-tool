<!doctype html>

<head>

<title>엑셀 파일 도구</title>
<style>
:root{font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#192c29;background:#f5f8f7}*{box-sizing:border-box}body{margin:0}header{height:72px;background:#fff;border-bottom:1px solid #e1ebe8;display:flex;align-items:center;padding:0 max(24px,calc((100vw - 1000px)/2));gap:11px;font-size:18px;font-weight:800}.brand-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:#fff;background:#176e5e;font-size:20px}main{max-width:1000px;margin:auto;padding:80px 24px} .eyebrow{font-size:13px;font-weight:800;letter-spacing:.12em;color:#197767}h1{font-size:clamp(32px,5vw,48px);line-height:1.2;letter-spacing:-.05em;margin:14px 0} .intro{font-size:17px;color:#6c807a;line-height:1.7;margin:0}.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:42px}.tool{display:flex;flex-direction:column;align-items:flex-start;text-decoration:none;color:inherit;background:#fff;border:1px solid #e0eae7;border-radius:16px;padding:28px;min-height:250px;box-shadow:0 8px 30px #263c3108;transition:border-color .15s,transform .15s}.tool:hover{border-color:#83b7a8;transform:translateY(-3px)}.tool:focus-visible{outline:3px solid #278c76;outline-offset:3px}.icon{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;background:#e8f5f0;color:#176e5e;font-size:24px;font-weight:700}h2{font-size:21px;margin:22px 0 8px;letter-spacing:-.03em}.tool p{font-size:15px;color:#71847e;line-height:1.7;margin:0}.action{font-size:14px;color:#176e5e;font-weight:800;margin-top:auto;padding-top:25px}.note{margin-top:28px;color:#82948e;font-size:13px;line-height:1.7}@media(max-width:650px){main{padding-top:48px}.tools{grid-template-columns:1fr}.tool{min-height:210px}}
</style>
</head>
<body>
<header><span class="brand-icon" aria-hidden="true">▦</span> 엑셀 파일 도구</header>
<main>
  <div class="eyebrow">CSV &amp; EXCEL TOOLS</div>
  <h1>파일 작업을 더 간편하게.</h1>
  <p class="intro">필요한 작업을 선택해 주세요.<br>파일 병합부터 출원연도별 분리까지 한곳에서 시작할 수 있습니다.</p>
  <div class="tools">
    <a class="tool" href="excel-merge/index.html"><span class="icon" aria-hidden="true">⊕</span><h2>파일 합치기</h2><p>여러 CSV와 XLSX 파일을 열 이름에 맞춰 하나의 파일로 병합합니다.</p><span class="action">파일 합치기 열기</span></a>
    <a class="tool" href="year-split/index.html"><span class="icon" aria-hidden="true">▤</span><h2>출원연도별 파일 분리</h2><p>출원일자를 기준으로 데이터를 연도별로 나누고 필요한 파일을 내려받습니다.</p><span class="action">파일 분리 열기</span></a>
  </div>
  <p class="note">각 도구는 브라우저에서 파일을 처리합니다. 파일 처리 라이브러리를 불러올 때 인터넷 연결이 필요합니다.</p>
</main>
